name: Poliedro addons - CI/CD staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "poliedro_*/**"
      - ".github/workflows/deploy-staging.yml"
      - ".github/scripts/deploy-poliedro-staging.sh"
      - ".github/actions/digitalocean-ssh/**"
  workflow_dispatch:
    inputs:
      connection_test_only:
        description: "Solo probar firewall, SSH y Odoo; sin subir addons ni modificar la BD"
        required: false
        type: boolean
        default: false
      install_modules:
        description: "Instalar addons poliedro_* (separados por coma; opcional)"
        required: false
        type: string
      update_modules:
        description: "Actualizar addons poliedro_* adicionales (separados por coma; opcional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: poliedro-staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout addons
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test temporary firewall authorization
        run: node --test .github/actions/digitalocean-ssh/test/*.test.cjs

      - name: Validate modules and deployment inputs
        id: validate
        env:
          INSTALL_MODULES: ${{ inputs.install_modules }}
          UPDATE_MODULES: ${{ inputs.update_modules }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          modules = sorted(p for p in root.iterdir() if p.is_dir() and (p / '__manifest__.py').is_file())
          errors = []
          for module in modules:
              if not module.name.startswith('poliedro_'):
                  errors.append(f'{module}: los addons transversales deben iniciar por poliedro_')
              manifest = module / '__manifest__.py'
              try:
                  ast.literal_eval(manifest.read_text(encoding='utf-8'))
              except (SyntaxError, ValueError) as exc:
                  errors.append(f'{manifest}: manifiesto inválido: {exc}')
              for source in module.rglob('*.py'):
                  if '__pycache__' in source.parts:
                      continue
                  try:
                      ast.parse(source.read_text(encoding='utf-8'), filename=str(source))
                  except (SyntaxError, UnicodeDecodeError) as exc:
                      errors.append(f'{source}: Python inválido: {exc}')
              for xml_file in module.rglob('*.xml'):
                  try:
                      ET.parse(xml_file)
                  except ET.ParseError as exc:
                      errors.append(f'{xml_file}: XML inválido: {exc}')

          names = {module.name for module in modules}
          if not modules:
              errors.append('No se encontraron addons instalables.')
          for field in ('INSTALL_MODULES', 'UPDATE_MODULES'):
              value = os.environ.get(field, '').strip()
              if not value:
                  continue
              selected = value.split(',')
              if any(not name.startswith('poliedro_') or name not in names for name in selected):
                  errors.append(f'{field} debe contener solo addons poliedro_* presentes en este commit.')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f'Validación correcta: {len(modules)} addons Poliedro.')
          PY

  deploy:
    name: deploy-staging
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DO_HOST: 138.197.65.167
      DO_USER: root
      DO_BASE_DIR: /opt/poliedro-odoo
      INSTALL_MODULES: ${{ inputs.install_modules }}
      UPDATE_MODULES: ${{ inputs.update_modules }}
    steps:
      - name: Checkout addons
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          fetch-depth: 2

      - name: Select deployment or connection-only mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONNECTION_TEST_ONLY: ${{ inputs.connection_test_only }}
        run: |
          set -euo pipefail
          deploy_code=false
          if [[ "$EVENT_NAME" == workflow_dispatch && "$CONNECTION_TEST_ONLY" != true ]]; then
            deploy_code=true
          elif [[ "$EVENT_NAME" == push ]]; then
            # A workflow-only PR must not update modules or restart Odoo.
            git rev-parse --verify HEAD^ >/dev/null
            if git diff --quiet HEAD^ HEAD -- ':(glob)poliedro_*/**' '.github/scripts/deploy-poliedro-staging.sh'; then
              echo "Automation-only change: testing connectivity without deploying addons."
            else
              status=$?
              [[ "$status" == 1 ]] || exit "$status"
              deploy_code=true
            fi
          fi
          echo "deploy_code=$deploy_code" >> "$GITHUB_OUTPUT"

      - name: Authorize this runner temporarily on SSH
        uses: ./.github/actions/digitalocean-ssh
        with:
          token: ${{ secrets.DO_FIREWALL_TOKEN }}
          firewall-id: cf8761d8-6808-4268-b4d3-a2886223406d
          droplet-id: "608212229"
          host: "138.197.65.167"

      - name: Configure SSH
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DO_SSH_PRIVATE_KEY" || { echo "Falta DO_SSH_PRIVATE_KEY." >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '138.197.65.167 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILqVFMa0KfH+v3eo6qS5f9ayKUG46lWB5LonitrBqm2t' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$DO_USER@$DO_HOST" 'test -d /opt/poliedro-odoo/src/custom-addons && test -d /opt/poliedro-odoo/incoming'

      - name: Package Poliedro addons
        if: steps.mode.outputs.deploy_code == 'true'
        run: |
          set -euo pipefail
          mapfile -t modules < <(find . -mindepth 2 -maxdepth 2 -name __manifest__.py -print | sed 's#^\./##; s#/__manifest__.py$##' | sort)
          ((${#modules[@]} > 0)) || { echo "No hay addons instalables." >&2; exit 1; }
          tar -czf "$RUNNER_TEMP/poliedro-addons.tar.gz" --exclude='__pycache__' --exclude='*.pyc' -C . "${modules[@]}"
          echo "modules=$(IFS=,; echo "${modules[*]}")" >> "$GITHUB_ENV"

      - name: Upload deployment bundles
        if: steps.mode.outputs.deploy_code == 'true'
        run: |
          set -euo pipefail
          archive="poliedro-${GITHUB_SHA}.tar.gz"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/poliedro-addons.tar.gz" "$DO_USER@$DO_HOST:$DO_BASE_DIR/incoming/$archive"
          echo "ADDONS_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Backup, deploy and verify Odoo
        if: steps.mode.outputs.deploy_code == 'true'
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DO_USER@$DO_HOST" \
            "bash -s -- '$ADDONS_ARCHIVE' '$modules' '$INSTALL_MODULES' '$UPDATE_MODULES'" \
            < .github/scripts/deploy-poliedro-staging.sh

      - name: Verify public Odoo without changing business data
        run: |
          python - <<'PY'
          import json
          import urllib.request

          base = 'https://www.holdinglalabranza.com'
          request = urllib.request.Request(
              base + '/web/webclient/version_info',
              data=json.dumps({'jsonrpc': '2.0', 'method': 'call', 'params': {}, 'id': 1}).encode(),
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              version = json.load(response)['result']['server_version']
              assert version.startswith('19.0') and '+e' in version, version
          with urllib.request.urlopen(base + '/web/login', timeout=20) as response:
              assert response.status == 200
          print('SSH verified; public Odoo is available:', version)
          PY
